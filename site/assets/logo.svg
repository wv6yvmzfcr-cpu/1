<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="bt" x1="22" y1="14" x2="104" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12628f"/><stop offset="1" stop-color="#18b4a8"/>
    </linearGradient>
    <linearGradient id="blue" x1="26" y1="80" x2="64" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0e5580"/><stop offset="1" stop-color="#15789a"/>
    </linearGradient>
    <linearGradient id="teal" x1="64" y1="96" x2="102" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#159c96"/><stop offset="1" stop-color="#1cb9ac"/>
    </linearGradient>
    <linearGradient id="gold" x1="44" y1="40" x2="92" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#edc264"/><stop offset="1" stop-color="#c1902a"/>
    </linearGradient>
    <linearGradient id="capg" x1="18" y1="55" x2="72" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#146492"/><stop offset="1" stop-color="#0d4a70"/>
    </linearGradient>
    <linearGradient id="birdg" x1="38" y1="50" x2="58" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#164f75"/><stop offset="1" stop-color="#0f3f5e"/>
    </linearGradient>
  </defs>

  <!-- open ring -->
  <path d="M31 84 A40 40 0 1 1 97 84" stroke="url(#bt)" stroke-width="9.5" stroke-linecap="round"/>
  <!-- infinity link (blue left, teal right) -->
  <path d="M31 84 C39 95 52 94 64 85" stroke="url(#blue)" stroke-width="8.5" stroke-linecap="round"/>
  <path d="M64 85 C76 94 89 95 97 84" stroke="url(#teal)" stroke-width="8.5" stroke-linecap="round"/>

  <!-- palm tree (right) -->
  <path d="M84 78 C84 70 83 62 84 54" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#18a89f" stroke-width="4.2" stroke-linecap="round">
    <path d="M84 53 C77 49 71 50 67 55"/>
    <path d="M84 53 C92 49 98 52 101 58"/>
    <path d="M84 53 C81 45 82 40 85 36"/>
    <path d="M84 53 C89 46 95 44 100 45"/>
    <path d="M84 53 C78 47 72 48 68 50"/>
  </g>

  <!-- hornbill (left) — clean perched silhouette facing right -->
  <g transform="translate(-1,-5)">
    <path d="M40 73 C35 64 38 55 47 53 C50 52 53 53 55 55 C57 57 56 60 55 61 C53 65 51 70 47 73 C45 74 42 74 40 73 Z" fill="url(#birdg)"/>
    <!-- casque + beak (gold) -->
    <path d="M55 55 C61 53 66 55 66 59" stroke="url(#gold)" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M55 60 C61 61 66 64 68 69" stroke="url(#gold)" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="51" cy="57" r="1.7" fill="#eaf3f6"/>
  </g>

  <!-- graduation cap (foreground, lower-left), tassel hangs left away from palm -->
  <g>
    <path d="M18 65 L45 56 L72 65 L45 74 Z" fill="url(#capg)"/>
    <path d="M33 69.5 L33 81 C33 85.5 57 85.5 57 81 L57 69.5 L45 74 Z" fill="#0d4767"/>
    <circle cx="18" cy="65" r="2.2" fill="#edc264"/>
    <path d="M18 65 C14 69 14 73 16 77" stroke="#e6b959" stroke-width="2.1" stroke-linecap="round"/>
    <circle cx="16.5" cy="78.5" r="2.5" fill="#e6b959"/>
  </g>
</svg>
