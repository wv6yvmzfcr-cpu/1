<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>إيدولينك — ادرس الإنجليزية في ماليزيا</title>
  <meta name="description" content="سجّل في معاهد اللغة الإنجليزية المعتمدة في ماليزيا، وتابع طلبك خطوة بخطوة." />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#2f6bff" />
  <meta property="og:site_name" content="EduLink" />
  <meta property="og:locale" content="ar_SA" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#f5f7fc; --surface:#ffffff; --surface-2:#f0f3fa;
      --ink:#141a24; --muted:#5d6879; --line:#e6ebf4;
      --brand:#2f6bff; --brand-ink:#1f52d6; --teal:#12b3a6;
      --accent:#ff6a3d; --accent-ink:#e8542a; --gold:#f5b53d;
      --ok:#12b886; --warn:#d98a12; --danger:#e0524a;
      --grad:linear-gradient(135deg,#2f6bff 0%,#12b3a6 100%);
      --grad-warm:linear-gradient(135deg,#ff7a45,#ff5e8a);
      --radius:20px; --radius-sm:13px; --radius-xs:10px;
      --sh-sm:0 2px 10px rgba(20,40,90,.06);
      --sh:0 14px 34px rgba(20,40,90,.10);
      --sh-lg:0 26px 60px rgba(20,40,90,.16);
      --tab-h:64px;
    }
    @media (prefers-color-scheme:dark){
      :root{
        --bg:#0c0f16; --surface:#151b25; --surface-2:#1b2331;
        --ink:#e9edf5; --muted:#93a0b5; --line:#252e3d;
        --brand:#5f8dff; --brand-ink:#7ba0ff; --teal:#2fd0c0;
        --accent:#ff8256; --accent-ink:#ff9a75; --gold:#f5c451;
        --sh-sm:0 2px 10px rgba(0,0,0,.4); --sh:0 14px 34px rgba(0,0,0,.5); --sh-lg:0 26px 60px rgba(0,0,0,.6);
      }
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      background:var(--bg); color:var(--ink);
      font-family:"Tajawal","Segoe UI",Tahoma,system-ui,-apple-system,Arial,sans-serif;
      font-size:16px; line-height:1.75; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    }
    a{color:var(--brand);text-decoration:none}
    button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
    img{max-width:100%;display:block}
    .hidden{display:none !important}
    .sp{flex:1}
    .desk-only{display:none !important}
    @media(min-width:820px){ .desk-only{display:inline-flex !important} }
    ::selection{background:rgba(47,107,255,.18)}

    /* ---------- buttons ---------- */
    .btn{
      background:var(--brand); color:#fff; border-radius:var(--radius-xs);
      padding:12px 20px; font-weight:800; font-size:15px; letter-spacing:.2px;
      display:inline-flex; align-items:center; justify-content:center; gap:8px;
      box-shadow:0 6px 18px rgba(47,107,255,.28); transition:transform .16s, box-shadow .16s, background .16s;
    }
    .btn:hover{transform:translateY(-2px); box-shadow:0 12px 26px rgba(47,107,255,.36)}
    .btn:active{transform:translateY(0)}
    .btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
    .btn.accent{background:var(--accent); box-shadow:0 6px 18px rgba(255,106,61,.32)}
    .btn.accent:hover{box-shadow:0 12px 26px rgba(255,106,61,.42)}
    .btn.ghost{background:var(--surface); border:1.5px solid var(--line); color:var(--ink); box-shadow:none}
    .btn.ghost:hover{border-color:var(--brand); background:var(--surface-2); transform:translateY(-1px)}
    .btn.sm{padding:8px 14px;font-size:14px;border-radius:10px;box-shadow:none}
    .btn.block{width:100%}

    input,select,textarea{
      width:100%; background:var(--surface); border:1.5px solid var(--line); color:var(--ink);
      border-radius:var(--radius-xs); padding:12px 14px; font:inherit; font-size:15px; outline:none;
      transition:border-color .15s, box-shadow .15s;
    }
    input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(47,107,255,.14)}
    label{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px;font-weight:700}
    select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
      background-position:calc(0% + 16px) center,calc(0% + 21px) center;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-inline-start:38px}

    /* ---------- header ---------- */
    header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
    .nav{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:16px}
    .logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:21px;color:var(--ink);cursor:pointer;letter-spacing:-.3px}
    .logo .mark{width:34px;height:34px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:19px;box-shadow:0 6px 16px rgba(47,107,255,.35)}
    .nav .navlinks{display:flex;gap:6px;margin-inline-start:8px}
    .nav .navlinks a{color:var(--muted);font-weight:700;font-size:15px;padding:8px 12px;border-radius:10px;transition:.15s}
    .nav .navlinks a:hover{color:var(--ink);background:var(--surface-2)}
    .nav .navlinks a.on{color:var(--brand);background:var(--surface-2)}
    .langbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:800;color:var(--ink)}
    .avatar{width:38px;height:38px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;cursor:pointer}

    main{max-width:1180px;margin:0 auto;padding:20px 18px calc(30px + var(--tab-h));min-height:60vh}
    @media(min-width:820px){ main{padding-bottom:60px} }

    /* ---------- hero ---------- */
    .hero{position:relative;overflow:hidden;border-radius:26px;padding:46px 34px;margin-bottom:26px;color:#fff;background:var(--grad);box-shadow:var(--sh)}
    .hero::before,.hero::after{content:"";position:absolute;border-radius:50%}
    .hero::before{width:300px;height:300px;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 70%);inset-block-start:-120px;inset-inline-start:-80px}
    .hero::after{width:240px;height:240px;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%);inset-block-end:-100px;inset-inline-end:-50px}
    .hero .in{position:relative;z-index:1}
    .hero .kicker{font-weight:800;font-size:14px;opacity:.92;margin-bottom:10px;display:inline-flex;gap:7px;align-items:center;background:rgba(255,255,255,.16);padding:5px 12px;border-radius:20px}
    .hero h1{font-size:clamp(28px,5vw,46px);line-height:1.2;margin:.1em 0 .35em;font-weight:900;letter-spacing:-.5px;max-width:15ch;text-wrap:balance}
    .hero p{font-size:clamp(16px,2.2vw,19px);opacity:.96;max-width:46ch;margin:0 0 22px;font-weight:500}
    .hero .btn{background:#fff;color:var(--brand-ink);box-shadow:0 10px 24px rgba(0,0,0,.16)}
    .hero .btn:hover{box-shadow:0 16px 30px rgba(0,0,0,.22)}
    .hero-stats{display:flex;gap:22px;margin-top:26px;flex-wrap:wrap}
    .hero-stats .st b{display:block;font-size:24px;font-weight:900;line-height:1}
    .hero-stats .st span{font-size:13px;opacity:.9}

    /* ---------- filters ---------- */
    .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 18px}
    .filters .lbl{font-weight:800;color:var(--muted);font-size:14px}
    .filters select{max-width:210px;width:auto}
    .sec-title{font-size:22px;font-weight:900;margin:8px 0 14px;letter-spacing:-.3px}

    /* ---------- cards / grid ---------- */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--sh-sm);display:flex;flex-direction:column;cursor:pointer;transition:transform .18s, box-shadow .18s;position:relative}
    .card:hover{transform:translateY(-4px);box-shadow:var(--sh-lg)}
    .card .media{position:relative;aspect-ratio:16/10;background:var(--grad);display:flex;align-items:center;justify-content:center;overflow:hidden}
    .card .media img{width:100%;height:100%;object-fit:cover}
    .card .media .mono{font-size:56px;font-weight:900;color:rgba(255,255,255,.9);letter-spacing:-2px}
    .card .rate{position:absolute;inset-block-start:12px;inset-inline-start:12px;background:rgba(0,0,0,.55);color:#fff;font-weight:800;font-size:13px;padding:4px 10px;border-radius:20px;display:flex;align-items:center;gap:4px;backdrop-filter:blur(4px)}
    .card .rate .star{color:var(--gold)}
    .card .body{padding:16px 17px 18px;display:flex;flex-direction:column;gap:9px;flex:1}
    .card h3{margin:0;font-size:18.5px;font-weight:800;letter-spacing:-.2px;line-height:1.35}
    .card .city{color:var(--muted);font-size:14px;font-weight:600;display:flex;align-items:center;gap:5px}
    .tags{display:flex;flex-wrap:wrap;gap:7px}
    .tag{background:var(--surface-2);border-radius:20px;padding:4px 11px;font-size:12.5px;color:var(--muted);font-weight:700}
    .card .foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding-top:6px}
    .price b{font-size:22px;font-weight:900;color:var(--ink)}
    .price small{font-weight:600;color:var(--muted);font-size:12.5px}
    .price .est{display:inline-block;font-size:11px;background:var(--surface-2);color:var(--muted);border-radius:6px;padding:1px 7px;margin-inline-start:5px;font-weight:700}
    .card .go{width:40px;height:40px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:18px;flex:0 0 40px;box-shadow:0 6px 14px rgba(47,107,255,.3)}

    .badge{display:inline-block;padding:3px 12px;border-radius:20px;font-size:13px;font-weight:800}
    .badge.on{background:rgba(18,184,134,.14);color:var(--ok)}
    .badge.warn{background:rgba(217,138,18,.16);color:var(--warn)}
    .badge.info{background:rgba(47,107,255,.14);color:var(--brand)}
    .badge.off{background:rgba(224,82,74,.14);color:var(--danger)}

    .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--sh-sm);margin-bottom:18px}
    .muted{color:var(--muted)} .center{text-align:center}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    h1.page{font-size:27px;font-weight:900;margin:8px 0 16px;letter-spacing:-.4px}
    .back{color:var(--muted);font-size:14.5px;font-weight:700;margin-bottom:12px;display:inline-flex;gap:6px;cursor:pointer;background:var(--surface);border:1px solid var(--line);padding:7px 13px;border-radius:20px}
    .back:hover{color:var(--ink)}

    /* stepper */
    .steps{display:flex;flex-direction:column;margin:6px 0}
    .step{display:flex;gap:14px;padding-bottom:22px;position:relative}
    .step::before{content:"";position:absolute;inset-inline-start:16px;top:34px;bottom:-6px;width:2px;background:var(--line)}
    .step:last-child::before{display:none}
    .step .dot{width:34px;height:34px;border-radius:50%;flex:0 0 34px;display:grid;place-items:center;font-weight:900;font-size:14px;background:var(--surface-2);color:var(--muted);z-index:1;border:2px solid var(--line)}
    .step.done .dot{background:var(--ok);color:#fff;border-color:var(--ok)}
    .step.now .dot{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 5px rgba(47,107,255,.16)}
    .step h4{margin:5px 0 2px;font-size:16.5px;font-weight:800}
    .step.now h4{color:var(--brand)}
    .step .action{background:rgba(47,107,255,.08);border:1px solid rgba(47,107,255,.2);border-radius:12px;padding:11px 13px;margin-top:9px;font-size:14.5px}

    .doc{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
    .doc:last-child{border-bottom:none}
    .doc .dinfo{flex:1;min-width:180px}
    .doc .dinfo b{font-size:15px;font-weight:800}
    .fix{background:rgba(224,82,74,.08);border:1px solid rgba(224,82,74,.25);border-radius:11px;padding:9px 12px;margin-top:7px;font-size:13.5px}
    details summary{cursor:pointer;font-weight:800;padding:2px 0}
    details summary::-webkit-details-marker{display:none}
    details summary::before{content:"+ ";color:var(--brand);font-weight:900}
    details[open] summary::before{content:"− "}

    /* modal */
    .overlay{position:fixed;inset:0;background:rgba(10,16,28,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:80}
    .modal{background:var(--surface);border-radius:22px;width:100%;max-width:430px;box-shadow:var(--sh-lg);padding:28px}
    .modal h2{margin:0 0 4px;font-size:24px;font-weight:900;letter-spacing:-.4px}
    .tabs{display:flex;gap:6px;margin:18px 0;background:var(--surface-2);padding:5px;border-radius:14px}
    .tab{flex:1;text-align:center;padding:10px;border-radius:10px;font-weight:800;color:var(--muted);transition:.15s}
    .tab.active{background:var(--surface);color:var(--brand);box-shadow:var(--sh-sm)}

    #toast{position:fixed;inset-block-end:calc(var(--tab-h) + 16px);inset-inline-start:16px;z-index:99;display:flex;flex-direction:column;gap:8px}
    @media(min-width:820px){ #toast{inset-block-end:22px} }
    .toast{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--brand);border-radius:13px;padding:13px 17px;box-shadow:var(--sh);font-size:14.5px;font-weight:600;max-width:330px;animation:slidein .25s}
    .toast.ok{border-inline-start-color:var(--ok)} .toast.err{border-inline-start-color:var(--danger)}
    @keyframes slidein{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

    .empty{padding:54px 20px;text-align:center;color:var(--muted);font-weight:600}
    .spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;margin:60px auto}
    @keyframes sp{to{transform:rotate(360deg)}}

    /* ---------- mobile bottom tab bar ---------- */
    .tabbar{position:fixed;inset-block-end:0;inset-inline:0;z-index:50;height:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));
      padding-bottom:env(safe-area-inset-bottom,0px);background:color-mix(in srgb,var(--surface) 92%,transparent);
      backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex}
    .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:800;transition:.15s}
    .tabbar a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .tabbar a.on{color:var(--brand)}
    .tabbar a.on svg{fill:rgba(47,107,255,.14)}
    @media(min-width:820px){ .tabbar{display:none} }
    @media(max-width:819px){ .nav .navlinks{display:none} .hero{padding:34px 22px} }

    footer{color:var(--muted);font-size:13px;text-align:center;padding:24px 18px;margin-bottom:var(--tab-h)}
    @media(min-width:820px){ footer{margin-bottom:0} }
    :focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:10px}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

    /* assistant chat */
    .fab{position:fixed;inset-block-end:calc(var(--tab-h) + 14px);inset-inline-end:16px;z-index:60;width:56px;height:56px;border-radius:18px;background:var(--grad);color:#fff;font-size:23px;box-shadow:var(--sh);display:grid;place-items:center}
    @media(min-width:820px){ .fab{inset-block-end:22px} }
    .chat{position:fixed;inset-block-end:calc(var(--tab-h) + 78px);inset-inline-end:16px;z-index:60;width:348px;max-width:calc(100vw - 32px);height:466px;max-height:70vh;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh-lg);display:flex;flex-direction:column;overflow:hidden}
    @media(min-width:820px){ .chat{inset-block-end:88px} }
    .chat-head{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:900;display:flex;gap:8px;align-items:center;background:var(--grad);color:#fff}
    .chat-head .link{color:#fff !important;opacity:.9}
    .chat-body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
    .msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.65;white-space:pre-wrap;font-weight:500}
    .msg.u{align-self:flex-start;background:var(--brand);color:#fff;border-end-start-radius:5px}
    .msg.a{align-self:flex-end;background:var(--surface);color:var(--ink);border-end-end-radius:5px;box-shadow:var(--sh-sm)}
    .chat-foot{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--surface)}
  </style>
</head>
<body>
  <header>
    <div class="nav">
      <div class="logo" onclick="go('#/')"><span class="mark">🎓</span> إيدولينك</div>
      <div class="navlinks">
        <a onclick="go('#/')" data-r="#/">المعاهد</a>
        <a onclick="go('#/how')" data-r="#/how">رحلة التقديم</a>
        <a onclick="go('#/housing')" data-r="#/housing">السكن</a>
      </div>
      <span class="sp"></span>
      <button class="langbtn" id="langBtn" type="button">EN</button>
      <span id="authArea"></span>
    </div>
  </header>

  <main id="app"><div class="spin"></div></main>

  <footer>إيدولينك — بوابة تسجيل الطلاب في معاهد اللغة بماليزيا</footer>

  <nav class="tabbar" id="tabbar">
    <a onclick="go('#/')" data-r="#/"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg><span>المعاهد</span></a>
    <a onclick="go('#/how')" data-r="#/how"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15 9-4 1.5L9.5 15l4-1.5z"/></svg><span>الرحلة</span></a>
    <a onclick="go('#/my')" data-r="#/my"><svg viewBox="0 0 24 24"><path d="M8 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg><span>طلباتي</span></a>
    <a onclick="tabAccount()" data-r="#/profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>حسابي</span></a>
  </nav>

  <div id="modalRoot"></div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
