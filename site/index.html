<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>إيدولينك — ادرس الإنجليزية في ماليزيا</title>
  <meta name="description" content="سجّل في معاهد اللغة الإنجليزية المعتمدة في ماليزيا، وتابع طلبك خطوة بخطوة." />
  <style>
    :root{
      --brand:#2563c9; --brand-2:#1b4fa0; --accent:#0fa06a; --accent-2:#0c855a;
      --bg:#f4f6fb; --card:#ffffff; --ink:#182030; --muted:#5d6678; --line:#e5e9f2;
      --warn:#b8790f; --danger:#d24b41; --ok:#0fa06a;
      --chip:#eef2fb; --radius:16px; --shadow:0 10px 34px rgba(24,45,90,.09);
    }
    @media (prefers-color-scheme:dark){
      :root{ --bg:#0e1219; --card:#161b25; --ink:#e7ebf3; --muted:#96a0b4; --line:#252c3a;
        --brand:#5c93ff; --brand-2:#4a82f0; --accent:#33c88b; --accent-2:#28b47c; --chip:#1b212d;
        --shadow:0 10px 34px rgba(0,0,0,.45); }
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{background:var(--bg);color:var(--ink);
      font-family:"Segoe UI","Noto Sans Arabic",Tahoma,system-ui,-apple-system,Arial,sans-serif;
      font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased}
    a{color:var(--brand);text-decoration:none}
    button{font-family:inherit;cursor:pointer}
    img{max-width:100%;display:block}
    .hidden{display:none !important}
    .sp{flex:1}

    /* buttons */
    .btn{background:var(--brand);color:#fff;border:none;border-radius:12px;padding:12px 20px;
      font-weight:700;font-size:15px;transition:.15s;display:inline-flex;align-items:center;gap:8px}
    .btn:hover{background:var(--brand-2)}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .btn.accent{background:var(--accent)} .btn.accent:hover{background:var(--accent-2)}
    .btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
    .btn.ghost:hover{border-color:var(--brand)}
    .btn.sm{padding:8px 14px;font-size:14px;border-radius:10px}
    .btn.block{width:100%;justify-content:center}

    input,select,textarea{width:100%;background:var(--card);border:1.5px solid var(--line);
      color:var(--ink);border-radius:11px;padding:11px 13px;font:inherit;font-size:15px;outline:none}
    input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,201,.12)}
    label{display:block;font-size:14px;color:var(--muted);margin:12px 0 6px;font-weight:600}

    /* header */
    header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 85%,transparent);
      backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .nav{max-width:1120px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px}
    .logo{display:flex;align-items:center;gap:9px;font-weight:900;font-size:19px;color:var(--ink);cursor:pointer}
    .logo .dot{width:13px;height:13px;border-radius:50%;background:var(--brand);box-shadow:0 0 12px var(--brand)}
    .nav a.link{color:var(--ink);font-weight:600;font-size:15px;padding:6px 4px}
    .nav a.link:hover{color:var(--brand)}
    .langbtn{background:var(--chip);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:14px;color:var(--ink)}

    main{max-width:1120px;margin:0 auto;padding:22px 18px 70px;min-height:60vh}

    /* hero */
    .hero{background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff;border-radius:24px;
      padding:44px 32px;margin-bottom:26px;position:relative;overflow:hidden}
    .hero h1{font-size:clamp(26px,4.4vw,42px);margin:.1em 0 .35em;line-height:1.25;text-wrap:balance;max-width:16ch}
    .hero p{font-size:18px;opacity:.95;max-width:52ch;margin:0 0 18px}
    .hero .btn{background:#fff;color:var(--brand-2)} .hero .btn:hover{background:#eef2fb}

    /* filter bar */
    .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
    .filters select,.filters input{max-width:220px}

    /* grid + cards */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
      box-shadow:var(--shadow);display:flex;flex-direction:column;transition:.15s}
    .card:hover{transform:translateY(-2px)}
    .card .thumb{height:158px;background:linear-gradient(135deg,#c9d8f5,#bfe8d6);position:relative;
      display:flex;align-items:center;justify-content:center;font-size:44px}
    .card .body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
    .card h3{margin:0;font-size:18px}
    .card .city{color:var(--muted);font-size:14px}
    .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
    .tag{background:var(--chip);border-radius:20px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
    .price{margin-top:auto;font-weight:800;font-size:19px;color:var(--brand)}
    .price small{font-weight:500;color:var(--muted);font-size:13px}
    .price .est{font-size:11px;background:var(--chip);color:var(--muted);border-radius:6px;padding:1px 6px;margin-inline-start:6px}

    .badge{display:inline-block;padding:3px 11px;border-radius:20px;font-size:13px;font-weight:700}
    .badge.on{background:rgba(15,160,106,.14);color:var(--ok)}
    .badge.warn{background:rgba(184,121,15,.15);color:var(--warn)}
    .badge.info{background:rgba(37,99,201,.13);color:var(--brand)}
    .badge.off{background:rgba(210,75,65,.13);color:var(--danger)}

    .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
      padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
    .muted{color:var(--muted)}
    .center{text-align:center}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    h1.page{font-size:26px;margin:6px 0 16px}
    .back{color:var(--muted);font-size:14px;margin-bottom:10px;display:inline-flex;gap:6px;cursor:pointer}

    /* stepper */
    .steps{display:flex;flex-direction:column;gap:0;margin:6px 0}
    .step{display:flex;gap:14px;padding-bottom:20px;position:relative}
    .step::before{content:"";position:absolute;inset-inline-start:15px;top:32px;bottom:-4px;width:2px;background:var(--line)}
    .step:last-child::before{display:none}
    .step .dot{width:32px;height:32px;border-radius:50%;flex:0 0 32px;display:grid;place-items:center;
      font-weight:800;font-size:14px;background:var(--chip);color:var(--muted);z-index:1}
    .step.done .dot{background:var(--accent);color:#fff}
    .step.now .dot{background:var(--brand);color:#fff;box-shadow:0 0 0 4px rgba(37,99,201,.18)}
    .step .st-body{flex:1}
    .step h4{margin:4px 0 2px;font-size:16px}
    .step.now h4{color:var(--brand)}
    .step .action{background:rgba(37,99,201,.08);border:1px solid var(--line);border-radius:10px;
      padding:10px 12px;margin-top:8px;font-size:14.5px}

    /* doc rows */
    .doc{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
    .doc:last-child{border-bottom:none}
    .doc .dinfo{flex:1;min-width:180px}
    .doc .dinfo b{font-size:15px}
    .fix{background:rgba(210,75,65,.08);border:1px solid rgba(210,75,65,.25);border-radius:10px;
      padding:8px 11px;margin-top:6px;font-size:13.5px}

    .overlay{position:fixed;inset:0;background:rgba(10,16,28,.55);display:flex;align-items:center;
      justify-content:center;padding:18px;z-index:60}
    .modal{background:var(--card);border-radius:18px;width:100%;max-width:420px;box-shadow:var(--shadow);padding:26px}
    .modal h2{margin:0 0 4px;font-size:22px}
    .tabs{display:flex;gap:6px;margin:16px 0}
    .tab{flex:1;text-align:center;padding:9px;border-radius:10px;background:var(--chip);font-weight:700;color:var(--muted)}
    .tab.active{background:var(--brand);color:#fff}

    #toast{position:fixed;inset-block-end:20px;inset-inline-start:20px;z-index:90;display:flex;flex-direction:column;gap:8px}
    .toast{background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--brand);
      border-radius:11px;padding:12px 16px;box-shadow:var(--shadow);font-size:14.5px;max-width:320px}
    .toast.ok{border-inline-start-color:var(--ok)} .toast.err{border-inline-start-color:var(--danger)}

    .empty{padding:48px 20px;text-align:center;color:var(--muted)}
    .spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;
      animation:sp .8s linear infinite;margin:40px auto}
    @keyframes sp{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.spin{animation:none}.card:hover{transform:none}}
    footer{border-top:1px solid var(--line);color:var(--muted);font-size:13.5px;text-align:center;padding:26px 18px}
    :focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}

    /* assistant chat */
    .fab{position:fixed;inset-block-end:20px;inset-inline-end:20px;z-index:70;width:56px;height:56px;
      border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:23px;box-shadow:var(--shadow)}
    .fab:hover{background:var(--accent-2)}
    .chat{position:fixed;inset-block-end:86px;inset-inline-end:20px;z-index:70;width:342px;
      max-width:calc(100vw - 36px);height:470px;max-height:72vh;background:var(--card);border:1px solid var(--line);
      border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
    .chat-head{padding:13px 16px;border-bottom:1px solid var(--line);font-weight:800;display:flex;gap:8px;align-items:center}
    .chat-body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
    .msg{max-width:84%;padding:9px 13px;border-radius:15px;font-size:14.5px;line-height:1.65;white-space:pre-wrap}
    .msg.u{align-self:flex-start;background:var(--brand);color:#fff;border-end-start-radius:4px}
    .msg.a{align-self:flex-end;background:var(--chip);color:var(--ink);border-end-end-radius:4px}
    .chat-foot{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
    details summary::-webkit-details-marker{display:none}
  </style>
</head>
<body>
  <header>
    <div class="nav">
      <div class="logo" onclick="go('#/')"><span class="dot"></span> إيدولينك</div>
      <a class="link" onclick="go('#/')">المعاهد</a>
      <a class="link" onclick="go('#/housing')">السكن</a>
      <span class="sp"></span>
      <button class="langbtn" id="langBtn" type="button">EN</button>
      <span id="authArea"></span>
    </div>
  </header>

  <main id="app"><div class="spin"></div></main>

  <footer>إيدولينك — بوابة تسجيل الطلاب في معاهد اللغة بماليزيا</footer>
  <div id="modalRoot"></div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
