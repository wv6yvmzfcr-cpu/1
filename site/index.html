<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>إيدولينك — ادرس الإنجليزية في ماليزيا</title>
  <meta name="description" content="سجّل في معاهد اللغة الإنجليزية المعتمدة في ماليزيا، وتابع طلبك خطوة بخطوة." />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#0f5c86" />
  <meta property="og:site_name" content="EduLink" />
  <meta property="og:locale" content="ar_SA" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root{
      /* Palette derived from the EduLink logo: deep ocean blue + teal + sand gold */
      --bg:#f6f8fb; --surface:#ffffff; --surface-2:#eff3f8;
      --ink:#0f1b26; --muted:#5b6b7b; --line:#e6ecf3;
      --brand:#0f5c86; --brand-ink:#0b4767; --teal:#15a8a0; --teal-ink:#0f8880;
      --accent:#c9992e; --accent-ink:#a97e1f; --gold:#d7a83e;
      --ok:#12a678; --warn:#c98a1a; --danger:#d9524b;
      --grad:linear-gradient(135deg,#0f5c86 0%,#15a8a0 100%);
      --grad-soft:linear-gradient(160deg,#0f5c86 0%,#137e8f 55%,#15a8a0 100%);
      --grad-warm:linear-gradient(135deg,#d7a83e,#c9992e);
      --ring:rgba(15,92,134,.16);
      --radius:18px; --radius-sm:13px; --radius-xs:10px;
      --sh-sm:0 1px 2px rgba(16,40,64,.05), 0 2px 8px rgba(16,40,64,.045);
      --sh:0 10px 30px rgba(16,40,64,.09);
      --sh-lg:0 24px 56px rgba(16,40,64,.14);
      --tab-h:64px;
    }
    @media (prefers-color-scheme:dark){
      :root{
        --bg:#0a1017; --surface:#111a24; --surface-2:#172230;
        --ink:#e8eef5; --muted:#93a3b5; --line:#22303f;
        --brand:#3fa3d1; --brand-ink:#63b9df; --teal:#2bd0c6; --teal-ink:#54ddd4;
        --accent:#e0b452; --accent-ink:#ecc46e; --gold:#e6bd5c;
        --ring:rgba(63,163,209,.22);
        --sh-sm:0 1px 2px rgba(0,0,0,.4); --sh:0 12px 32px rgba(0,0,0,.5); --sh-lg:0 26px 60px rgba(0,0,0,.62);
      }
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      background:var(--bg); color:var(--ink);
      font-family:"Tajawal","Segoe UI",Tahoma,system-ui,-apple-system,Arial,sans-serif;
      font-size:16px; line-height:1.75; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    }
    a{color:var(--brand);text-decoration:none}
    button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
    img{max-width:100%;display:block}
    .hidden{display:none !important}
    .sp{flex:1}
    .desk-only{display:none !important}
    @media(min-width:820px){ .desk-only{display:inline-flex !important} }
    ::selection{background:color-mix(in srgb,var(--brand) 20%,transparent)}

    /* ---------- buttons ---------- */
    .btn{
      background:var(--brand); color:#fff; border-radius:12px;
      padding:12px 22px; font-weight:800; font-size:15px; letter-spacing:.1px;
      display:inline-flex; align-items:center; justify-content:center; gap:8px;
      box-shadow:0 1px 2px rgba(16,40,64,.12); transition:transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s, background .18s, filter .18s;
    }
    .btn:hover{transform:translateY(-1px); background:var(--brand-ink); box-shadow:0 8px 20px color-mix(in srgb,var(--brand) 30%,transparent)}
    .btn:active{transform:translateY(0)}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;filter:saturate(.6)}
    .btn.accent{background:var(--accent);color:#20160a;box-shadow:0 1px 2px rgba(80,56,0,.18)}
    .btn.accent:hover{background:var(--accent-ink);color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 34%,transparent)}
    .btn.ghost{background:var(--surface); border:1.5px solid var(--line); color:var(--ink); box-shadow:none}
    .btn.ghost:hover{border-color:color-mix(in srgb,var(--brand) 45%,var(--line)); background:var(--surface-2); transform:translateY(-1px)}
    .btn.sm{padding:8px 15px;font-size:14px;border-radius:10px;box-shadow:none}
    .btn.block{width:100%}

    input,select,textarea{
      width:100%; background:var(--surface); border:1.5px solid var(--line); color:var(--ink);
      border-radius:12px; padding:12px 14px; font:inherit; font-size:15px; outline:none;
      transition:border-color .16s, box-shadow .16s, background .16s;
    }
    input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--muted) 72%,transparent)}
    input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--ring)}
    input:hover:not(:focus),select:hover:not(:focus),textarea:hover:not(:focus){border-color:color-mix(in srgb,var(--brand) 30%,var(--line))}
    label{display:block;font-size:13.5px;color:var(--ink);margin:15px 0 6px;font-weight:800;letter-spacing:.1px}
    select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
      background-position:calc(0% + 16px) center,calc(0% + 21px) center;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-inline-start:38px}

    /* ---------- header ---------- */
    header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid transparent;transition:border-color .25s, box-shadow .25s, background .25s}
    header.scrolled{border-bottom-color:var(--line);box-shadow:0 1px 0 rgba(16,40,64,.02),0 8px 24px rgba(16,40,64,.05)}
    .nav{max-width:1180px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:16px}
    .logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;color:var(--ink);cursor:pointer;letter-spacing:-.3px}
    .logo .mark{width:38px;height:38px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:19px;font-weight:900;box-shadow:0 4px 12px color-mix(in srgb,var(--brand) 32%,transparent);overflow:hidden}
    .logo .mark:has(img){background:none;box-shadow:none;padding:0;width:42px;height:42px;border-radius:0}
    .logo .mark img{width:100%;height:100%;object-fit:contain}
    .logo .wordmark{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
    .logo img.brandfull{height:34px;width:auto;border-radius:0;box-shadow:none;background:none}
    .nav .navlinks{display:flex;gap:4px;margin-inline-start:10px}
    .nav .navlinks a{color:var(--muted);font-weight:700;font-size:15px;padding:8px 13px;border-radius:10px;transition:.15s;position:relative}
    .nav .navlinks a:hover{color:var(--ink);background:var(--surface-2)}
    .nav .navlinks a.on{color:var(--brand);background:color-mix(in srgb,var(--brand) 9%,transparent)}
    .langbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 13px;font-size:13.5px;font-weight:800;color:var(--ink);transition:.15s}
    .langbtn:hover{border-color:color-mix(in srgb,var(--brand) 40%,var(--line));color:var(--brand)}
    .avatar{width:38px;height:38px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;cursor:pointer;box-shadow:0 3px 10px color-mix(in srgb,var(--brand) 30%,transparent)}

    main{max-width:1180px;margin:0 auto;padding:20px 18px calc(30px + var(--tab-h));min-height:60vh}
    @media(min-width:820px){ main{padding-bottom:60px} }

    /* ---------- hero ---------- */
    .hero{position:relative;overflow:hidden;border-radius:24px;padding:52px 38px;margin-bottom:28px;color:#fff;background:var(--grad-soft);box-shadow:var(--sh);isolation:isolate}
    .hero::before,.hero::after{content:"";position:absolute;pointer-events:none}
    /* soft light bloom + subtle grid texture, calm not busy */
    .hero::before{inset:0;background:
      radial-gradient(120% 120% at 88% -10%,rgba(255,255,255,.30),transparent 46%),
      radial-gradient(90% 90% at -8% 115%,rgba(0,0,0,.16),transparent 52%);z-index:-1}
    .hero::after{inset:0;opacity:.5;z-index:-1;
      background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
      background-size:34px 34px;mask-image:radial-gradient(120% 90% at 85% 0%,#000,transparent 60%);-webkit-mask-image:radial-gradient(120% 90% at 85% 0%,#000,transparent 60%)}
    .hero .in{position:relative;z-index:1;max-width:640px}
    /* subtle transparent brand watermark inside the banner */
    .hero-mark{position:absolute;z-index:0;inset-inline-end:-30px;top:50%;transform:translateY(-50%);height:108%;width:auto;opacity:.085;filter:brightness(0) invert(1);pointer-events:none;user-select:none}
    @media(max-width:819px){.hero-mark{height:auto;width:82%;inset-inline-end:-16%;top:auto;bottom:-10%;transform:none;opacity:.09}}
    .hero .kicker{font-weight:800;font-size:13.5px;letter-spacing:.2px;margin-bottom:14px;display:inline-flex;gap:7px;align-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);padding:6px 13px;border-radius:20px;backdrop-filter:blur(4px)}
    .hero h1{font-size:clamp(30px,5.2vw,48px);line-height:1.14;margin:.1em 0 .4em;font-weight:900;letter-spacing:-.6px;max-width:16ch;text-wrap:balance;text-shadow:0 1px 24px rgba(0,0,0,.12)}
    .hero p{font-size:clamp(16px,2.2vw,19px);opacity:.95;max-width:48ch;margin:0 0 26px;font-weight:500;line-height:1.7}
    .hero .btn{background:#fff;color:var(--brand-ink);box-shadow:0 8px 22px rgba(0,0,0,.18)}
    .hero .btn:hover{background:#fff;color:var(--brand-ink);box-shadow:0 14px 30px rgba(0,0,0,.24)}
    .hero .btn.ghost{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.4);color:#fff}
    .hero .btn.ghost:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.6)}
    .hero-stats{display:flex;gap:30px;margin-top:30px;flex-wrap:wrap}
    .hero-stats .st b{display:block;font-size:26px;font-weight:900;line-height:1;letter-spacing:-.4px}
    .hero-stats .st span{font-size:13px;opacity:.88;font-weight:600}
    .hero-stats .st{position:relative;padding-inline-start:16px}
    .hero-stats .st::before{content:"";position:absolute;inset-inline-start:0;top:2px;bottom:2px;width:2px;border-radius:2px;background:rgba(255,255,255,.35)}

    /* ---------- filters ---------- */
    .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 18px}
    .filters .lbl{font-weight:800;color:var(--muted);font-size:14px}
    .filters select{max-width:210px;width:auto}
    .sec-title{font-size:22px;font-weight:900;margin:8px 0 14px;letter-spacing:-.3px}

    /* ---------- cards / grid ---------- */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--sh-sm);display:flex;flex-direction:column;cursor:pointer;transition:transform .18s, box-shadow .18s;position:relative}
    .card:hover{transform:translateY(-4px);box-shadow:var(--sh-lg)}
    .card .media{position:relative;aspect-ratio:16/10;background:var(--grad);display:flex;align-items:center;justify-content:center;overflow:hidden}
    .card .media img{width:100%;height:100%;object-fit:cover}
    .card .media .mono{font-size:56px;font-weight:900;color:rgba(255,255,255,.9);letter-spacing:-2px}
    .card .rate{position:absolute;inset-block-start:12px;inset-inline-start:12px;background:rgba(0,0,0,.55);color:#fff;font-weight:800;font-size:13px;padding:4px 10px;border-radius:20px;display:flex;align-items:center;gap:4px;backdrop-filter:blur(4px)}
    .card .rate .star{color:var(--gold)}
    .card .body{padding:16px 17px 18px;display:flex;flex-direction:column;gap:9px;flex:1}
    .card h3{margin:0;font-size:18.5px;font-weight:800;letter-spacing:-.2px;line-height:1.35}
    .card .city{color:var(--muted);font-size:14px;font-weight:600;display:flex;align-items:center;gap:5px}
    .tags{display:flex;flex-wrap:wrap;gap:7px}
    .tag{background:var(--surface-2);border-radius:20px;padding:4px 11px;font-size:12.5px;color:var(--muted);font-weight:700}
    .card .foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding-top:6px}
    .price b{font-size:22px;font-weight:900;color:var(--ink)}
    .price small{font-weight:600;color:var(--muted);font-size:12.5px}
    .price .est{display:inline-block;font-size:11px;background:var(--surface-2);color:var(--muted);border-radius:6px;padding:1px 7px;margin-inline-start:5px;font-weight:700}
    .card .go{width:40px;height:40px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:18px;flex:0 0 40px;box-shadow:0 4px 12px color-mix(in srgb,var(--brand) 30%,transparent);transition:transform .18s,background .18s}
    .card:hover .go{background:var(--teal);transform:translateY(-1px)}

    .badge{display:inline-block;padding:3px 12px;border-radius:20px;font-size:13px;font-weight:800}
    .badge.on{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
    .badge.warn{background:color-mix(in srgb,var(--warn) 17%,transparent);color:var(--warn)}
    .badge.info{background:color-mix(in srgb,var(--brand) 13%,transparent);color:var(--brand)}
    .badge.off{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}

    .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--sh-sm);margin-bottom:18px}
    .muted{color:var(--muted)} .center{text-align:center}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    h1.page{font-size:27px;font-weight:900;margin:8px 0 16px;letter-spacing:-.4px}
    .back{color:var(--muted);font-size:14.5px;font-weight:700;margin-bottom:12px;display:inline-flex;gap:6px;cursor:pointer;background:var(--surface);border:1px solid var(--line);padding:7px 13px;border-radius:20px}
    .back:hover{color:var(--ink)}

    /* stepper */
    .steps{display:flex;flex-direction:column;margin:6px 0}
    .step{display:flex;gap:14px;padding-bottom:22px;position:relative}
    .step::before{content:"";position:absolute;inset-inline-start:16px;top:34px;bottom:-6px;width:2px;background:var(--line)}
    .step:last-child::before{display:none}
    .step .dot{width:34px;height:34px;border-radius:50%;flex:0 0 34px;display:grid;place-items:center;font-weight:900;font-size:14px;background:var(--surface-2);color:var(--muted);z-index:1;border:2px solid var(--line);transition:.2s}
    .step.done .dot{background:var(--ok);color:#fff;border-color:var(--ok)}
    .step.now .dot{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 5px var(--ring)}
    .step h4{margin:5px 0 2px;font-size:16.5px;font-weight:800}
    .step.now h4{color:var(--brand)}
    .step .action{background:color-mix(in srgb,var(--brand) 7%,transparent);border:1px solid color-mix(in srgb,var(--brand) 20%,transparent);border-radius:12px;padding:11px 13px;margin-top:9px;font-size:14.5px}

    .doc{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
    .doc:last-child{border-bottom:none}
    .doc .dinfo{flex:1;min-width:180px}
    .doc .dinfo b{font-size:15px;font-weight:800}
    .fix{background:rgba(224,82,74,.08);border:1px solid rgba(224,82,74,.25);border-radius:11px;padding:9px 12px;margin-top:7px;font-size:13.5px}
    details summary{cursor:pointer;font-weight:800;padding:2px 0}
    details summary::-webkit-details-marker{display:none}
    details summary::before{content:"+ ";color:var(--brand);font-weight:900}
    details[open] summary::before{content:"− "}

    /* modal */
    .overlay{position:fixed;inset:0;background:rgba(10,16,28,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:80}
    .modal{background:var(--surface);border-radius:22px;width:100%;max-width:430px;box-shadow:var(--sh-lg);padding:28px}
    .modal .modal-logo{height:58px;width:auto;margin:0 auto 12px;display:block;border-radius:12px}
    .modal h2{margin:0 0 4px;font-size:24px;font-weight:900;letter-spacing:-.4px}
    .tabs{display:flex;gap:6px;margin:18px 0;background:var(--surface-2);padding:5px;border-radius:14px}
    .tab{flex:1;text-align:center;padding:10px;border-radius:10px;font-weight:800;color:var(--muted);transition:.15s}
    .tab.active{background:var(--surface);color:var(--brand);box-shadow:var(--sh-sm)}

    #toast{position:fixed;inset-block-end:calc(var(--tab-h) + 16px);inset-inline-start:16px;z-index:99;display:flex;flex-direction:column;gap:8px}
    @media(min-width:820px){ #toast{inset-block-end:22px} }
    .toast{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--brand);border-radius:13px;padding:13px 17px;box-shadow:var(--sh);font-size:14.5px;font-weight:600;max-width:330px;animation:slidein .25s}
    .toast.ok{border-inline-start-color:var(--ok)} .toast.err{border-inline-start-color:var(--danger)}
    @keyframes slidein{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

    .empty{padding:54px 20px;text-align:center;color:var(--muted);font-weight:600}
    .spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;margin:60px auto}
    @keyframes sp{to{transform:rotate(360deg)}}

    /* ---------- mobile bottom tab bar ---------- */
    .tabbar{position:fixed;inset-block-end:0;inset-inline:0;z-index:50;height:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));
      padding-bottom:env(safe-area-inset-bottom,0px);background:color-mix(in srgb,var(--surface) 92%,transparent);
      backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex}
    .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:800;transition:.15s}
    .tabbar a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .tabbar a.on{color:var(--brand)}
    .tabbar a.on svg{fill:color-mix(in srgb,var(--brand) 14%,transparent)}
    @media(min-width:820px){ .tabbar{display:none} }
    @media(max-width:819px){ .nav .navlinks{display:none} .hero{padding:34px 22px} }

    footer{margin-top:44px;border-top:1px solid var(--line);background:var(--surface);color:var(--muted);padding:34px 18px calc(34px + var(--tab-h))}
    @media(min-width:820px){ footer{padding-bottom:34px} }
    footer .fwrap{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:18px 40px;align-items:center;justify-content:space-between}
    footer .fbrand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;color:var(--ink)}
    footer .fbrand .mark{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:17px;overflow:hidden}
    footer .fbrand .mark:has(img){background:none;box-shadow:none;padding:0}
    footer .fbrand .mark img{width:100%;height:100%;object-fit:contain}
    footer .ftag{font-size:13.5px;max-width:42ch;line-height:1.7}
    footer .fnote{width:100%;text-align:center;font-size:12.5px;color:color-mix(in srgb,var(--muted) 80%,transparent);border-top:1px solid var(--line);padding-top:16px;margin-top:4px}

    /* scroll reveal (respects reduced-motion below) */
    .reveal{opacity:0;transform:translateY(14px);transition:opacity .6s cubic-bezier(.2,.7,.3,1),transform .6s cubic-bezier(.2,.7,.3,1)}
    .reveal.in{opacity:1;transform:none}

    :focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:10px}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1!important;transform:none!important}}

    /* assistant chat */
    .fab{position:fixed;inset-block-end:calc(var(--tab-h) + 14px);inset-inline-end:16px;z-index:60;width:56px;height:56px;border-radius:18px;background:var(--grad);color:#fff;font-size:23px;box-shadow:var(--sh);display:grid;place-items:center}
    @media(min-width:820px){ .fab{inset-block-end:22px} }
    .chat{position:fixed;inset-block-end:calc(var(--tab-h) + 78px);inset-inline-end:16px;z-index:60;width:348px;max-width:calc(100vw - 32px);height:466px;max-height:70vh;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh-lg);display:flex;flex-direction:column;overflow:hidden}
    @media(min-width:820px){ .chat{inset-block-end:88px} }
    .chat-head{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:900;display:flex;gap:8px;align-items:center;background:var(--grad);color:#fff}
    .chat-head .link{color:#fff !important;opacity:.9}
    .chat-body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
    .msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.65;white-space:pre-wrap;font-weight:500}
    .msg.u{align-self:flex-start;background:var(--brand);color:#fff;border-end-start-radius:5px}
    .msg.a{align-self:flex-end;background:var(--surface);color:var(--ink);border-end-end-radius:5px;box-shadow:var(--sh-sm)}
    .chat-foot{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--surface)}

    /* ---------- document scanner ---------- */
    .scanwrap{position:fixed;inset:0;z-index:95;background:#0b0e13;display:flex;flex-direction:column}
    .scan-stage{position:relative;flex:1;overflow:hidden;background:#000}
    .scan-stage video{width:100%;height:100%;object-fit:cover}
    .scan-frame{position:absolute;inset:9% 6%;border:2px dashed rgba(255,255,255,.75);border-radius:16px;pointer-events:none}
    .scan-frame span{position:absolute;width:26px;height:26px;border:3px solid #fff}
    .scan-frame .c1{inset-block-start:-3px;inset-inline-start:-3px;border-inline-end:0;border-block-end:0;border-radius:14px 0 0 0}
    .scan-frame .c2{inset-block-start:-3px;inset-inline-end:-3px;border-inline-start:0;border-block-end:0;border-radius:0 14px 0 0}
    .scan-frame .c3{inset-block-end:-3px;inset-inline-start:-3px;border-inline-end:0;border-block-start:0;border-radius:0 0 0 14px}
    .scan-frame .c4{inset-block-end:-3px;inset-inline-end:-3px;border-inline-start:0;border-block-start:0;border-radius:0 0 14px 0}
    .scan-lite{position:absolute;inset-block-start:14px;inset-inline-start:14px;padding:8px 14px;border-radius:20px;font-weight:800;font-size:13.5px;color:#fff;background:rgba(0,0,0,.55);backdrop-filter:blur(4px)}
    .scan-lite.good{background:rgba(18,184,134,.9)} .scan-lite.low{background:rgba(217,138,18,.92)}
    .scan-x{position:absolute;inset-block-start:14px;inset-inline-end:14px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:20px}
    .scan-hint{position:absolute;inset-block-end:14px;inset-inline:0;text-align:center;color:#fff;font-size:14px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.6)}
    .scan-thumbs{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;background:#11151c;min-height:0}
    .scan-thumbs:empty{display:none}
    .scan-thumbs .th{position:relative;flex:0 0 auto}
    .scan-thumbs img{height:56px;border-radius:8px;border:1px solid #2a3340}
    .scan-thumbs .pg{position:absolute;inset-block-start:-6px;inset-inline-start:-6px;background:var(--brand);color:#fff;border-radius:50%;width:20px;height:20px;font-size:11px;font-weight:800;display:grid;place-items:center}
    .scan-ctrl{padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:#11151c;display:flex;gap:12px;align-items:center;justify-content:space-between}
    .shutter{width:70px;height:70px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.35);flex:0 0 70px;margin:0 auto}
    .shutter:active{transform:scale(.94)}
  </style>
</head>
